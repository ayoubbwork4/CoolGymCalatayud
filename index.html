<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cool Gym - Kiosco Interactivo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="antialiased text-gray-100 selection:bg-red-600 selection:text-white">

    <div class="fixed inset-0 z-[-1] bg-black">
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-gray-900 via-black to-black opacity-95"></div>
    </div>

    <div class="container mx-auto p-4 md:p-8 max-w-7xl relative z-10">

        <header class="flex flex-col md:flex-row justify-between items-center mb-10 pb-6 border-b border-red-900/30">
            <div class="flex items-center gap-5 animate-slide-in">
                <img src="media/logo.png" alt="The Cool Gym" class="h-24 drop-shadow-[0_0_15px_rgba(220,38,38,0.6)] hover:scale-105 transition-transform duration-500"
                     onerror="this.style.display='none'; document.getElementById('alt-logo').classList.remove('hidden')">
                
                <div id="alt-logo" class="hidden">
                    <h1 class="font-display text-5xl font-bold uppercase italic text-red-600">Cool Gym</h1>
                </div>

                <div>
                    <h1 class="font-display text-5xl md:text-7xl uppercase leading-none text-white tracking-wider">
                        The <span class="text-red-600 neon-text">Cool</span> Gym
                    </h1>
                    <p class="font-sans text-gray-500 text-xs md:text-sm tracking-[0.4em] uppercase mt-1 border-l-2 border-red-600 pl-3">Donde nacen las bestias</p>
                </div>
            </div>
            
            <div class="mt-8 md:mt-0 text-center md:text-right">
                <button id="rouletteBtn" class="group relative inline-block transition-transform active:scale-95 hover:scale-105 duration-200">
                    <div class="absolute inset-0 bg-red-600 rounded-xl blur-lg opacity-40 group-hover:opacity-70 animate-pulse transition-opacity duration-300"></div>
                    
                    <div class="relative bg-black border-2 border-red-600 rounded-xl p-4 flex items-center gap-4 shadow-2xl">
                        <div class="bg-red-900/20 p-2 rounded-full border border-red-500/30">
                            <ion-icon name="dice-outline" class="text-4xl text-red-500 group-hover:rotate-180 transition-transform duration-700"></ion-icon>
                        </div>
                        <div class="text-left">
                            <p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">¿No sabes qué hacer?</p>
                            <p class="font-display text-3xl text-white leading-none group-hover:text-red-500 transition-colors">PRUEBA TU SUERTE</p>
                        </div>
                    </div>
                </button>
            </div>
        </header>

        <div class="mb-12 space-y-6">
            <div class="relative group transform transition-all hover:scale-[1.01]">
                <div class="absolute inset-0 bg-red-600 rounded-lg blur opacity-10 group-hover:opacity-30 transition duration-500"></div>
                <div class="relative flex items-center bg-gray-900 border-2 border-gray-800 rounded-lg overflow-hidden focus-within:border-red-600 transition-colors">
                    <ion-icon name="search" class="text-4xl text-gray-600 ml-6"></ion-icon>
                    <input type="text" id="searchInput" placeholder="BUSCAR EJERCICIO..." 
                           class="w-full p-6 bg-transparent text-xl md:text-3xl font-display tracking-wide text-white placeholder-gray-600 focus:outline-none uppercase">
                </div>
            </div>

            <button id="mobileMenuBtn" class="md:hidden w-full bg-gray-900 border border-gray-700 text-white font-display text-2xl uppercase tracking-wider py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-gray-800 hover:border-red-600 transition-all shadow-lg active:scale-95">
                <ion-icon name="filter"></ion-icon> FILTROS / CATEGORÍAS
            </button>

            <div class="hidden md:grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3 transition-all duration-300 ease-in-out" id="categoryButtons">
                <button class="cat-btn active col-span-2 md:col-span-4 lg:col-span-1" data-category="all">
                    <ion-icon name="grid"></ion-icon> TODO
                </button>
                <button class="cat-btn" data-category="pecho">PECHO</button>
                <button class="cat-btn" data-category="espalda">ESPALDA</button>
                <button class="cat-btn" data-category="piernas">PIERNAS</button>
                <button class="cat-btn" data-category="hombros">HOMBROS</button>
                <button class="cat-btn" data-category="brazos">BRAZOS</button>
                <button class="cat-btn" data-category="core">ABS</button>
                <button class="cat-btn" data-category="cardio">CARDIO</button>
            </div>
        </div>

        <div id="exerciseGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 pb-20 transition-opacity duration-500">
            </div>

        <div id="noResults" class="hidden text-center py-20 opacity-0 transition-opacity duration-500">
            <ion-icon name="fitness-outline" class="text-7xl text-gray-800 mb-4"></ion-icon>
            <p class="font-display text-4xl text-gray-500 uppercase">Sin resultados.</p>
        </div>

    </div>

    <div id="exerciseModal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
        <div class="absolute inset-0 bg-black/95 backdrop-blur-md transition-opacity" onclick="closeModal()"></div>

        <div class="flex items-center justify-center min-h-screen p-2 sm:p-4">
            <div class="relative bg-gray-900 border border-red-900/30 rounded-2xl w-full max-w-6xl overflow-hidden shadow-[0_0_100px_rgba(220,38,38,0.15)] flex flex-col lg:flex-row max-h-[95vh] animate-modal-up">
                
                <button class="absolute top-4 right-4 z-50 lg:hidden text-white bg-red-600/80 rounded-full p-2" onclick="closeModal()">
                    <ion-icon name="close" class="text-2xl"></ion-icon>
                </button>

                <div class="w-full lg:w-2/3 bg-black flex items-center justify-center relative group h-[35vh] lg:h-auto border-b lg:border-b-0 lg:border-r border-gray-800">
                    <iframe id="modalVideo" class="w-full h-full absolute inset-0" src="" title="Video Ejercicio" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <div class="w-full lg:w-1/3 bg-gray-950 p-6 md:p-8 flex flex-col overflow-y-auto h-[60vh] lg:h-auto custom-scrollbar">
                    <div class="mb-6 border-b border-gray-800 pb-4">
                        <span id="modalCategory" class="text-red-500 font-bold text-xs uppercase tracking-[0.3em] mb-2 block border border-red-500/20 inline-block px-2 py-1 rounded bg-red-500/5">Categoría</span>
                        <h3 id="modalTitle" class="text-4xl md:text-5xl font-display font-bold text-white uppercase leading-none italic tracking-wide">NOMBRE</h3>
                    </div>

                    <div class="mb-6 space-y-2">
                        <p class="text-gray-500 text-xs uppercase tracking-widest font-bold flex items-center justify-between">
                            <span class="flex items-center gap-2"><ion-icon name="eye"></ion-icon> Guía Visual (GIF)</span>
                            <span class="text-[10px] opacity-50 font-normal lowercase text-red-400">(click para agrandar)</span>
                        </p>
                        
                        <div class="rounded-lg overflow-hidden border border-gray-800 bg-gray-900 relative aspect-video shadow-lg group cursor-pointer hover:border-red-500 transition-colors" onclick="openImageViewer()">
                            <img id="modalImg1" src="" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition duration-500">
                            
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity duration-300">
                                <ion-icon name="expand" class="text-white text-5xl drop-shadow-xl"></ion-icon>
                            </div>
                        </div>
                    </div>

                    <div class="flex-grow">
                        <p class="text-gray-500 text-xs uppercase tracking-widest font-bold mb-3 flex items-center gap-2">
                            <ion-icon name="git-branch"></ion-icon> Variantes
                        </p>
                        <ul id="modalVariants" class="space-y-2"></ul>
                    </div>
                    
                    <div class="mt-8 pt-4">
                        <button onclick="closeModal()" class="w-full group relative px-6 py-4 font-display font-bold text-white uppercase text-2xl tracking-wider overflow-hidden rounded bg-gray-800 border border-gray-700 hover:border-red-600 transition-all duration-300">
                            <div class="absolute inset-0 w-0 bg-red-600 transition-all duration-[250ms] ease-out group-hover:w-full"></div>
                            <span class="relative flex justify-center items-center gap-2">
                                <ion-icon name="checkmark-done-circle"></ion-icon> ¡A DARLE!
                            </span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="imageViewerModal" class="fixed inset-0 hidden" style="z-index: 9999;" onclick="closeImageViewer()">
        <div class="absolute inset-0 bg-black/95 backdrop-blur-xl transition-opacity"></div>
        <div class="relative z-10 flex items-center justify-center h-screen w-screen p-4 animate-modal-up">
            <img id="enlargedImage" src="" class="max-h-[90vh] max-w-[95vw] object-contain rounded-lg shadow-2xl border border-gray-800 bg-black">
            
            <button class="absolute top-6 right-6 text-white bg-red-600 rounded-full p-4 hover:bg-red-700 transition-colors shadow-lg z-50">
                <ion-icon name="close" class="text-4xl"></ion-icon>
            </button>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('mobileMenuBtn');
            const filters = document.getElementById('categoryButtons');

            if(menuBtn && filters) {
                menuBtn.addEventListener('click', () => {
                    if (filters.classList.contains('hidden')) {
                        filters.classList.remove('hidden');
                        filters.classList.add('grid');
                        menuBtn.innerHTML = '<ion-icon name="close"></ion-icon> CERRAR FILTROS';
                        menuBtn.classList.add('bg-red-900', 'border-red-600');
                    } else {
                        filters.classList.add('hidden');
                        filters.classList.remove('grid');
                        menuBtn.innerHTML = '<ion-icon name="filter"></ion-icon> FILTROS / CATEGORÍAS';
                        menuBtn.classList.remove('bg-red-900', 'border-red-600');
                    }
                });
            }
        });
    </script>
</body>
</html>
