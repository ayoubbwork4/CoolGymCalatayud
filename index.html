<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cool Gym - Kiosco Interactivo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="antialiased text-gray-100 selection:bg-red-600 selection:text-white">

    <div class="fixed inset-0 z-[-1] bg-black">
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-gray-900 via-black to-black opacity-90"></div>
    </div>

    <div class="container mx-auto p-4 md:p-8 max-w-7xl relative z-10">

        <header class="flex flex-col md:flex-row justify-between items-center mb-10 pb-6 border-b border-white/10">
            <div class="flex items-center gap-5 animate-slide-in">
                <img src="logo.png" alt="The Cool Gym" class="h-20 md:h-24 drop-shadow-[0_0_15px_rgba(220,38,38,0.6)]"
                     onerror="this.style.display='none'; document.getElementById('alt-logo').classList.remove('hidden')">
                
                <div id="alt-logo" class="hidden">
                    <h1 class="font-display text-5xl font-bold uppercase italic text-red-600">Cool Gym</h1>
                </div>

                <div>
                    <h1 class="font-display text-5xl md:text-6xl uppercase leading-none text-white tracking-wider">
                        The <span class="text-red-600 neon-text">Cool</span> Gym
                    </h1>
                    <p class="font-sans text-gray-400 text-xs md:text-sm tracking-[0.3em] uppercase mt-1">Donde nacen las bestias</p>
                </div>
            </div>
            
            <div class="mt-6 md:mt-0 text-center md:text-right">
                <div class="inline-block px-4 py-2 border border-red-900/50 bg-red-900/10 rounded-lg">
                    <p class="font-display text-2xl text-gray-300">ASISTENTE VIRTUAL</p>
                    <p class="text-red-500 text-xs font-bold uppercase tracking-widest animate-pulse">Toca un ejercicio para empezar</p>
                </div>
            </div>
        </header>

        <div class="mb-12 space-y-6">
            <div class="relative group transform transition-all hover:scale-[1.01]">
                <div class="absolute inset-0 bg-red-600 rounded-lg blur opacity-20 group-hover:opacity-30 transition duration-500"></div>
                <div class="relative flex items-center bg-gray-900/80 border border-gray-700 rounded-lg overflow-hidden backdrop-blur-sm">
                    <ion-icon name="search" class="text-3xl text-red-500 ml-6"></ion-icon>
                    <input type="text" id="searchInput" placeholder="BUSCAR EJERCICIO (EJ: PRESS BANCA, SENTADILLA...)" 
                           class="w-full p-5 bg-transparent text-xl md:text-2xl font-display tracking-wide text-white placeholder-gray-500 focus:outline-none uppercase">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3" id="categoryButtons">
                <button class="cat-btn active" data-category="all">
                    <ion-icon name="grid-outline"></ion-icon> TODO
                </button>
                <button class="cat-btn" data-category="pecho">
                    <ion-icon name="fitness-outline"></ion-icon> PECHO
                </button>
                <button class="cat-btn" data-category="espalda">
                    <ion-icon name="body-outline"></ion-icon> ESPALDA
                </button>
                <button class="cat-btn" data-category="piernas">
                    <ion-icon name="walk-outline"></ion-icon> PIERNAS
                </button>
                <button class="cat-btn" data-category="hombros">
                    <ion-icon name="barbell-outline"></ion-icon> HOMBROS
                </button>
                <button class="cat-btn" data-category="brazos">
                    <ion-icon name="hammer-outline"></ion-icon> BRAZOS
                </button>
                </div>
        </div>

        <div id="exerciseGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20">
            </div>

        <div id="noResults" class="hidden text-center py-20 opacity-0 transition-opacity duration-500">
            <ion-icon name="alert-circle-outline" class="text-6xl text-gray-700 mb-4"></ion-icon>
            <p class="font-display text-4xl text-gray-500 uppercase">No encontramos ese ejercicio.</p>
            <p class="text-gray-600 mt-2">Prueba buscando por grupo muscular.</p>
        </div>

    </div>

    <div id="exerciseModal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md transition-opacity" onclick="closeModal()"></div>

        <div class="flex items-center justify-center min-h-screen p-2 sm:p-4">
            <div class="relative bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-6xl overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.8)] flex flex-col lg:flex-row max-h-[90vh]">
                
                <button class="absolute top-4 right-4 z-50 lg:hidden text-white bg-black/50 rounded-full p-2" onclick="closeModal()">
                    <ion-icon name="close" class="text-2xl"></ion-icon>
                </button>

                <div class="w-full lg:w-2/3 bg-black flex items-center justify-center relative group h-[40vh] lg:h-auto">
                    <iframe id="modalVideo" class="w-full h-full absolute inset-0" src="" title="Video Ejercicio" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <div class="w-full lg:w-1/3 bg-gray-900/95 p-6 md:p-8 flex flex-col border-l border-gray-800 overflow-y-auto h-[50vh] lg:h-auto">
                    
                    <div class="mb-6 border-b border-red-900/30 pb-4">
                        <span id="modalCategory" class="text-red-500 font-bold text-xs uppercase tracking-[0.2em] mb-1 block">Categoría</span>
                        <h3 id="modalTitle" class="text-4xl md:text-5xl font-display font-bold text-white uppercase leading-none italic">NOMBRE</h3>
                    </div>

                    <div class="mb-6 space-y-4">
                        <p class="text-gray-400 text-sm uppercase tracking-wider font-semibold">Guía Visual</p>
                        <div class="rounded-lg overflow-hidden border border-gray-700 bg-black relative aspect-video">
                            <img id="modalImg1" src="" class="w-full h-full object-cover opacity-90 hover:opacity-100 transition duration-500">
                        </div>
                    </div>

                    <div class="flex-grow">
                        <p class="text-gray-400 text-sm uppercase tracking-wider font-semibold mb-3">Variantes / Similares</p>
                        <ul id="modalVariants" class="space-y-2">
                            </ul>
                    </div>
                    
                    <div class="mt-8 pt-4">
                        <button onclick="closeModal()" class="w-full group relative px-6 py-3 font-display font-bold text-white uppercase text-2xl tracking-wider overflow-hidden rounded bg-transparent border border-red-600 hover:text-white transition-all duration-300">
                            <div class="absolute inset-0 w-0 bg-red-600 transition-all duration-[250ms] ease-out group-hover:w-full"></div>
                            <span class="relative">CERRAR Y ENTRENAR</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
